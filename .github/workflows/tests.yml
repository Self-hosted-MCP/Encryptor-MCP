# Runs every test on macOS, Windows and Linux, with the oldest and newest supported Python, for every push and
# pull request. The compatibility tests use the reference libraries (fetched from Maven Central by
# tests/java/fetch_jars.py, each file checked against a pinned SHA-256), so vaults written here open in
# Cryptomator on every system. Free on a public repository.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Allow long paths (Windows)
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1, pinned
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa   # v10.3.0, pinned
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad   # v6.1.0, pinned
        with:
          distribution: temurin
          java-version: "25"
      - name: Fetch Cryptomator's libraries (checksums pinned)
        run: uv run --no-project python tests/java/fetch_jars.py "${{ github.workspace }}/.jars"
      - name: Lint (ruff)
        run: uvx --from ruff==0.17.2 ruff check .
      - name: Tests
        env:
          CRYPTOMATOR_MODS: ${{ github.workspace }}/.jars
          REQUIRE_REFERENCE: "1"
        run: uv run pytest -q

  workflows:
    name: workflows (zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1, pinned
        with:
          persist-credentials: false
      # Unsafe patterns in GitHub Actions: leaked tokens, injection, broad permissions.
      - run: pipx run zizmor==1.31.1 --offline .
